[workspace]
resolver = "2"
members = [
    "crates/skp-core",
    "crates/skp-io",
    "crates/skp-repair",
    "crates/skp-retopo",
    "crates/skp-uv",
    "crates/skp-bake",
    "crates/skp-export",
    "crates/skpforge-cli",
    "crates/skpforge-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
skp-core = { path = "crates/skp-core" }
skp-io = { path = "crates/skp-io" }
skp-repair = { path = "crates/skp-repair" }
skp-retopo = { path = "crates/skp-retopo" }
